name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24


      - name: Install
        # Seu workflow falhou por incompatibilidade entre package.json e package-lock.json.
        # Usar npm install recria o lock no ambiente do CI e evita o erro do npm ci.
        run: npm install


      - name: Build
        run: |
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Next.js static export output
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true


